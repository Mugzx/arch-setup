# : Manager [[[

[manager]
cwd = { fg = "#e6e1e9" }

# Tab
tab_active = { fg = "#35275e", bg = "#cebdff", bold = true }
tab_inactive = { fg = "#e8ddff", bg = "#1f1048" }
tab_width = 1

# Find
find_keyword = { fg = "#ffb4ab", bold = true, italic = true, underline = true }
find_position = { fg = "#ffb4ab", bold = true, italic = true }

# Marker
marker_copied = { fg = "#ff739c", bg = "#ff739c" }
marker_cut = { fg = "#ffd9e4", bg = "#ffd9e4" }
marker_marked = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_selected = { fg = "#efb8c9", bg = "#efb8c9" }

# Count
count_copied = { fg = "#31101e", bg = "#ffd9e4" }
count_cut = { fg = "#31101e", bg = "#ffd9e4" }
count_selected = { fg = "#35275e", bg = "#efb8c9" }

# Border
border_symbol = "│"
border_style  = { fg = "#cebdff" }

# : ]]]


# : Status [[[

[status]
separator_open = "🭁"
separator_close = "🭠"
separator_style = { bg = "#35275e", fg = "#F4A261" }

[mode]
# Mode
normal_main = { bg = "#cebdff", fg = "#35275e", bold = true }
normal_alt  = { bg = "#48454e", fg = "#cac4cf" }

# Select mode
select_main = { bg = "#cbc3dc", fg = "#322e41", bold = true }
select_alt  = { bg = "#48454e", fg = "#cac4cf" }

# Unset mode
unset_main = { bg = "#efb8c9", fg = "#492533", bold = true }
unset_alt  = { bg = "#48454e", fg = "#cac4cf" }

# Progress
progress_label = { bold = true }
progress_normal = { fg = "#cebdff", bg = "#3a383e" }
progress_error = { fg = "#ffb4ab", bg = "#3a383e" }

# Permissions
permissions_t = { fg = "#7762a4" }
permissions_w = { fg = "#d33b6a" }
permissions_x = { fg = "#ff2b12" }
permissions_r = { fg = "#ff4077" }
permissions_s = { fg = "#8144ff" }

# : ]]]


# : Select [[[

[select]
border = { fg = "#cebdff" }
active = { fg = "#efb8c9", bold = true }
inactive = {}

# : ]]]


# : Input [[[

[input]
border = { fg = "#cebdff" }
value = { fg = "#e6e1e9" }

# : ]]]


# : Completion [[[

[completion]
border = { fg = "#cebdff", bg = "#35275e" }

# : ]]]


# : Tasks [[[

[tasks]
border = { fg = "#cebdff" }
title = {}
hovered = { fg = "#ffd9e4", underline = true }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#3a383e" }
cand = { fg = "#cebdff" }
rest = { fg = "#35275e" }
desc = { fg = "#e6e1e9" }
separator = " ▶ "
separator_style = { fg = "#e6e1e9" }

# : ]]]


# : Help [[[

[help]
on = { fg = "#e6e1e9" }
run = { fg = "#e6e1e9" }
footer = { fg = "#322e41", bg = "#cbc3dc" }

# : ]]]


# : Notify [[[

[notify]
title_info = { fg = "#efb8c9" }
title_warn = { fg = "#cebdff" }
title_error = { fg = "#ffb4ab" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#94e2d5" },

    # Media
    { mime = "{audio,video}/*", fg = "#f9e2af" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f5c2e7" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#a6e3a1" },

    # Special files
    { name = "*", is = "orphan", bg = "#93000a" },
    { name = "*", is = "exec", fg = "#ffdad6" },

    # Fallback
    { name = "*", fg = "#e6e1e9" },
    { name = "*/", fg = "#cebdff" },
]

# : ]]]
